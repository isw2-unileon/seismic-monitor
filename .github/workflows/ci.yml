name: Go Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: seismic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Database Migrations
        env:
          PGPASSWORD: testpassword
        run: |
          # Wait for database to be ready
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for database..."
            sleep 2
          done
          psql -h localhost -U testuser -d seismic_test -f ./backend/migrations/000001_init_schema.up.sql
      
      - name: Install and Tidy Dependencies
        run: |
          go mod tidy
          go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m ./backend/...

      - name: Run Unit and Integration Tests
        env:
          CGO_ENABLED: 1
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_NAME: seismic_test
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/seismic_test?sslmode=disable
        run: go test -v -race -cover ./backend/...